<div class="group relative flex h-full  flex-col overflow-hidden rounded-2xl bg-white/30 backdrop-blur-2xl p-6 shadow-lg border border-gray-100 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl w-[20vw]">
  
  <div class="pointer-events-none absolute top-0 left-0 h-full w-full [mask-image:linear-gradient(white,transparent)] opacity-80 transition-opacity duration-300 group-hover:opacity-100">
    <div class="absolute inset-0 bg-gradient-to-br from-(--color-secondary)/5 to-transparent">
      <svg aria-hidden="true" class="absolute inset-0 h-full w-full fill-(--color-secondary)/10 stroke-(--color-secondary)/20 mix-blend-overlay" viewBox="0 0 100% 100%" preserveAspectRatio="none">
        <defs>
          <pattern id="grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M24 0V24H0" fill="none" stroke-width="1"></path>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid-pattern)" stroke-width="0"></rect>

        <rect width="24" height="24" x="96" y="24" stroke-width="0"></rect>
        <rect width="24" height="24" x="144" y="72" stroke-width="0"></rect>
        <rect width="24" height="24" x="48" y="120" stroke-width="0"></rect>
      </svg>
    </div>
  </div>

  <div class="relative z-10 flex h-14 w-14 items-center justify-center rounded-xl bg-(--color-primary)/10 text-(--color-primary) transition-transform duration-300 group-hover:scale-110 group-hover:bg-(--color-primary) group-hover:text-white">
    <i class="{{ icon }} text-2xl"></i>
  </div>

  <h3 class="relative z-10 mt-6 font-(--font-heading) text-lg font-bold text-gray-800 md:text-xl">
    {{ title }}
  </h3>

  <p class="relative z-10 mt-2 font-(--font-body) text-sm font-medium leading-relaxed text-gray-600">
    {{ description }}
  </p>
</div>
