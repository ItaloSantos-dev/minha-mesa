<div
  class="flex h-full max-w-[320px] flex-col justify-center rounded-[10px] p-8 shadow-[0_20px_30px_-20px_rgba(5,5,5,0.24)]"
  style="font-family: var(--font-body);"
>
  <div class="flex items-center gap-4">

    <img
      [src]="this.image"
      alt="Foto de perfil"
      class="h-16 w-16 shrink-0 rounded-full object-cover"
    />

    <div>
      <div
        class="flex justify-start gap-0.5"
        style="color: var(--color-highlight);"
      >
        <!-- estrelas -->
      </div>

      <p
        class="mt-1 text-lg font-semibold leading-7 text-gray-800"
        style="font-family: var(--font-heading);"
      >
        {{ this.name }}
      </p>
    </div>
  </div>

  <p
    class="mt-4 overflow-hidden text-gray-600"
    style="font-family: var(--font-body);"
  >
    {{ this.message }}
  </p>
