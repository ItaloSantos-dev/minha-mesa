<div class="absolute left-1/4 p-4 -top-1/4 flex -translate-x-1/2 -translate-y-1/2 w-full h-full z-0 boxes-transform" [class]="class">
  @for (row of rows; track $index; let i = $index) {
    <div class="w-16 h-8 border-l border-slate-700 relative">
      @for (col of cols; track $index; let j = $index) {
        <div
          (mouseenter)="onEnter($event)"
          (mouseleave)="onLeave($event)"
          class="w-16 h-8 border-r border-t border-slate-700 relative transition-colors"
        >
          @if (isPlus(i, j)) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="absolute h-6 w-10 -top-[14px] -left-[22px] text-slate-700 stroke-[1px] pointer-events-none"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
            </svg>
          }
        </div>
      }
    </div>
  }
</div>
