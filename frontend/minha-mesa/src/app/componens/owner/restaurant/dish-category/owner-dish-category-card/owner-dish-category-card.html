<article
  class="group overflow-hidden rounded-2xl border border-[color-mix(in_srgb,var(--color-coffee)_10%,transparent)] bg-white/90 shadow-[0_.8rem_2rem_rgba(90,69,60,.06)] transition hover:-translate-y-1 hover:shadow-[0_.9rem_2rem_rgba(90,69,60,.12)]"
  [class.opacity-60]="!category().active"
>
  <div class="relative h-48 overflow-hidden bg-[color-mix(in_srgb,var(--color-background)_65%,white)]">
    @if (category().imageLink) {
      <img
        class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        [src]="category().imageLink"
        [alt]="'Imagem da categoria ' + category().name"
        loading="lazy"
      />
    } @else {
      <div class="grid h-full place-items-center text-4xl text-(--color-secondary)" aria-hidden="true">
        <i class="bi bi-tags"></i>
      </div>
    }
    <span class="absolute bottom-3 left-3 rounded-full bg-white/95 px-3 py-1.5 text-sm font-bold text-(--color-primary) shadow-sm backdrop-blur">
      {{ category().dishes.length }} pratos
    </span>
  </div>

  <div class="flex items-center justify-between gap-3 p-5">
    <h2 class="mb-0 [font-family:var(--font-heading)] text-lg font-semibold leading-snug text-(--color-coffee)">
      {{ category().name }}
    </h2>
    <span class="shrink-0 text-xs font-bold text-(--color-secondary)">
      {{ category().active ? 'Ativa' : 'Desativada' }}
    </span>
  </div>
</article>
