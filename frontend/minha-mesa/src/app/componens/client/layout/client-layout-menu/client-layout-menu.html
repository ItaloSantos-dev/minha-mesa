<aside class="w-64 sticky top-0 h-screen overflow-hidden bg-(--color-secondary) border-r border-slate-200/80 min-h-screen flex flex-col justify-between shrink-0 font-sans antialiased">

    
    <!-- Parte Superior: Logo e Rotas -->
    <div>
        <!-- Brand / Logo Area -->
        <div class="h-16 flex items-center px-6  gap-2.5 justify-center">
        
            <a
                href="#"
                class=" text-3xl font-extrabold tracking-tight shrink-0"
            >
                <span class="text-white">Minha</span>
                <span class="text-(--color-highlight)"> Mesa</span>
            </a>
        </div>

        <!-- Título de Seção do Menu -->
        <div class="px-6 pt-6 pb-2">
        <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Navegação Principal</p>
        </div>

        <!-- Links do Menu (Baseado no Sem título.png) -->
        <nav class="px-3 space-y-1">
        
            <div class="relative flex flex-col w-full">

                <div 
                    [style.transform]="'translateY(' + (currentPage() * 100) + '%)'"
                    class="absolute inset-x-0 top-0 h-11 text-white bg-emerald-500/35 border-l-4 border-emerald-600 z-0 transition-all duration-300 ease-out rounded-r-xl">
                </div>

                <a  routerLink="/client/home"
                    [classList]="buttonMenuClassList">
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" [classList]="svgMenuClassList" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7" />
                        </svg>
                        Ínicio
                    </div>
                </a>

                <a  routerLink="/client/restaurants"
                    [classList]="buttonMenuClassList">
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" [classList]="svgMenuClassList" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <circle cx="11" cy="11" r="7" stroke-width="2" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m16 16 5 5" />
                        </svg>
                        Buscar restaurante
                    </div>
                </a>

                <a routerLink="/owner/restaurant/tables" [classList]="buttonMenuClassList">
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" [classList]="svgMenuClassList" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 3h7l5 5v13H5V3h2z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 3v5h5M8 12h8M8 16h8" />
                        </svg>
                        Histórico
                    </div>
                </a>

                <a routerLink="/owner/restaurant/working-schedules" [classList]="buttonMenuClassList">
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" [classList]="svgMenuClassList" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <rect x="3" y="5" width="18" height="16" rx="2" stroke-width="2" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 3v4M8 3v4M3 10h18m-9 3v4m0 0 3-2" />
                        </svg>
                        Reservas
                    </div>
                </a>

            </div>
        </nav>
    </div>
</aside>
